name: orion_commons
description: "A community-driven Flutter app that connects people through skills, knowledge, resources, and meaningful help."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.3
  
  # Dependency Injection
  get_it: ^7.6.4
  
  # Networking
  dio: ^5.3.3
  
  # Data handling & Functional Programming
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Localization
  easy_localization: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/fonts/manrope/
    - assets/fonts/wittgenstein/

  fonts:
     - family: manrope
       fonts:
         - asset: assets/fonts/manrope/Manrope-Bold.ttf
           weight: 700
         - asset: assets/fonts/manrope/Manrope-ExtraBold.ttf
           weight: 800
         - asset: assets/fonts/manrope/Manrope-Light.ttf
           weight: 300
         - asset: assets/fonts/manrope/Manrope-Medium.ttf
           weight: 500
         - asset: assets/fonts/manrope/Manrope-Regular.ttf
           weight: 400
         - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
           weight: 600
     - family: wittgenstein
       fonts:
         - asset: assets/fonts/wittgenstein/wittgenstein-Bold.ttf
           weight: 700
         - asset: assets/fonts/wittgenstein/wittgenstein-ExtraBold.ttf
           weight: 800
         - asset: assets/fonts/wittgenstein/wittgenstein-Medium.ttf
           weight: 500
         - asset: assets/fonts/wittgenstein/wittgenstein-Regular.ttf
           weight: 400
         - asset: assets/fonts/wittgenstein/wittgenstein-SemiBold.ttf
           weight: 600


