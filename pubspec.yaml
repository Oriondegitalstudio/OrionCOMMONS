name: orion_commons
description: "A community-driven Flutter app that connects people through skills, knowledge, resources, and meaningful help."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.3
  
  # Dependency Injection
  get_it: ^7.6.4
  
  # Networking
  dio: ^5.3.3
  
  # Data handling & Functional Programming
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Localization
  easy_localization: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/fonts/

  # fonts:
  #   - family: MyCustomFont
  #     fonts:
  #       - asset: assets/fonts/MyCustomFont-Regular.ttf
  #       - asset: assets/fonts/MyCustomFont-Bold.ttf
  #         weight: 700


